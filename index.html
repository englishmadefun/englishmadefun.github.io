<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4F5DFF">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Made Fun"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
</head><body><title>English. Made Fun.</title>
<style>
/* Fonts are served from the app's own site: no third-party requests. */
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-display:swap;src:url(atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-display:swap;src:url(atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:600;font-display:swap;src:url(bricolage-grotesque-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:800;font-display:swap;src:url(bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
</style>
<style>
/* Layout: phone-first app shell — header, one scrolling view, fixed five-tab bar. Feed view is a full-height vertical snap scroller. */
:root{
  --bg:#F2F3FA; --surface:#FFFFFF; --surface-2:#E8EAF6; --fg:#141938; --muted:#5B6288;
  --accent:#4F5DFF; --accent-fg:#FFFFFF; --line:#D6D9EC;
  --good:#1E9E6A; --bad:#D2433B;
  --bronze:#B8733F; --silver:#8E9AAD; --gold:#D9A514; --plat:#3FA7C4;
  --halloween:#E2711D;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs:16px; --radius:18px;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1230; --surface:#181E48; --surface-2:#222A5C; --fg:#ECEEFF; --muted:#A3A9D6;
  --accent:#7D88FF; --accent-fg:#0E1230; --line:#2D3568; --good:#4CD39A; --bad:#FF7A70;
  --bronze:#D99561; --silver:#C3CCDA; --gold:#F2C744; --plat:#7DD6EE; --halloween:#FF9440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1230; --surface:#181E48; --surface-2:#222A5C; --fg:#ECEEFF; --muted:#A3A9D6;
  --accent:#7D88FF; --accent-fg:#0E1230; --line:#2D3568; --good:#4CD39A; --bad:#FF7A70;
  --bronze:#D99561; --silver:#C3CCDA; --gold:#F2C744; --plat:#7DD6EE; --halloween:#FF9440; color-scheme:dark}
:root[data-size="L"]{--fs:18px} :root[data-size="XL"]{--fs:20px}
html,body{height:100%}
/* no double-tap zoom on fast taps (flashcards, quizzes); pinch-zoom still works where allowed */
html,body,button,.btn,a,input,label,[role=button]{touch-action:manipulation}
button,.btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--fs);line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
header.top{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:none}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15em;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.chip{font-size:.75em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);padding:3px 9px;border-radius:99px}
.spacer{flex:1}
.iconbtn{background:none;border:0;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative}
.iconbtn svg{width:22px;height:22px}
.dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:4px 16px calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom,0px))}
.view[hidden]{display:none!important}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:20}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar-h)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68em;font-weight:700;color:var(--muted);position:relative}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px}
/* feed */
#v-feed{padding:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.card{scroll-snap-align:start;scroll-snap-stop:always;height:100%;padding:12px 16px calc(var(--tabbar-h) + 20px + env(safe-area-inset-bottom,0px));display:flex}
.card .face{flex:1;border-radius:26px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.kind{font-size:.72em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.kind i{width:10px;height:10px;border-radius:3px;background:var(--k,var(--accent));display:inline-block}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.1em,11vw,3.2em);letter-spacing:-.02em;line-height:1.02}
.mid{font-family:var(--f-display);font-weight:600;font-size:1.45em;line-height:1.2}
.ipa{color:var(--muted);font-size:.95em}
.ex{border-left:3px solid var(--k,var(--accent));padding-left:12px;color:var(--fg);font-style:italic}
.it{font-size:.85em;color:var(--muted)}
.opts{display:grid;gap:10px;margin-top:auto}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 16px;text-align:left;font-weight:700}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.why{font-size:.92em;color:var(--muted)}
.swipe{margin-top:auto;font-size:.8em;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center}
.swipe svg{width:16px;height:16px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.feedbar{position:absolute;top:10px;left:28px;right:28px;height:4px;border-radius:2px;background:var(--surface-2);z-index:2;pointer-events:none}
.feedbar span{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width .3s}
.playbtn{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;border:0;background:var(--accent);color:var(--accent-fg);padding:12px 18px;border-radius:99px;font-weight:700}
.playbtn svg{width:18px;height:18px}
.playbtn.on{background:var(--fg);color:var(--bg)}
.k-word{--k:#4F5DFF}.k-quiz{--k:#1E9E6A}.k-idiom{--k:#C04BC9}.k-fact{--k:#D9A514}.k-listen{--k:#E2711D}.k-grammar{--k:#2A9BC4}.k-speak{--k:#D2433B}.k-event{--k:var(--halloween)}.k-story{--k:#8A5A2B}.k-news{--k:#E8664F}
.face.done{background:var(--accent);color:var(--accent-fg);border:0;justify-content:center;align-items:flex-start}
.face.done .kind{color:inherit;opacity:.8}
.face.event{background:linear-gradient(160deg,color-mix(in srgb,var(--halloween) 28%,var(--surface)),var(--surface) 70%)}
/* generic sections */
.sec{display:grid;gap:12px;margin-block:18px}
.sec>h2{font-size:1.25em}
.eyebrow{font-size:.72em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.list{display:grid;gap:10px}
.row{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;width:100%}
.row .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--k)}
.row .ic svg{width:22px;height:22px}
.row .tx{min-width:0;flex:1}
.row .tx b{display:block}
.row .tx small{color:var(--muted);display:block;font-size:.82em}
.new{font-size:.66em;font-weight:700;letter-spacing:.08em;background:var(--bad);color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.k-handout{--k:#4F5DFF}.k-homework{--k:#1E9E6A}.k-listening{--k:#E2711D}.k-literature{--k:#C04BC9}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:10px}
.btn{border:0;background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:12px 16px;font-weight:700}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}
/* countdown */
.count{display:flex;align-items:baseline;gap:10px}
.count .n{font-family:var(--f-display);font-weight:800;font-size:3em;line-height:1;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.78em;background:var(--surface-2);border-radius:99px;padding:3px 10px}
/* flashcard */
.flash{perspective:900px;height:220px}
.flash .in{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .sd{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px;text-align:center;background:var(--surface);border:1px solid var(--line)}
.flash .bk{transform:rotateY(180deg);background:var(--surface-2)}
/* timer ring */
.ring{width:120px;height:120px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:2em;font-variant-numeric:tabular-nums}
/* trophies */
.tsum{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.lvl{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);position:relative}
.lvl::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.lvl span{position:relative;z-index:1;font-family:var(--f-display);font-weight:800;font-size:1.5em}
.tiers{display:flex;gap:14px;flex-wrap:wrap;font-weight:700;font-variant-numeric:tabular-nums}
.tiers span{display:flex;align-items:center;gap:5px}
.cup{width:18px;height:18px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.troph{display:flex;gap:14px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.troph .ic{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.troph .ic svg{width:26px;height:26px}
.troph.locked{opacity:.62}
.troph.locked .ic svg{filter:grayscale(1)}
.troph .tx{flex:1;min-width:0}
.troph .tx small{display:block;color:var(--muted);font-size:.82em}
.troph .mini{height:5px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.troph .mini span{display:block;height:100%;background:var(--k)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 6px;font-weight:700;font-size:.85em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
/* me */
.avatar{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;font-size:2.2em;background:var(--surface-2)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.set>div{min-width:0}
.set small{display:block;color:var(--muted);font-size:.8em}
.switch{width:50px;height:30px;border-radius:15px;border:0;background:var(--surface-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:23px}
input.txt{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
textarea.txt{width:100%;font:inherit;font-size:.75em;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);min-height:70px}
/* sheet & toast */
.scrim{position:fixed;inset:0;background:rgba(8,10,30,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 4px}
.sheet{will-change:transform;overscroll-behavior:contain}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-140%);z-index:60;background:#12162E;color:#fff;border-radius:16px;padding:10px 16px 10px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0)}
.toast .ic{width:40px;height:40px;border-radius:50%;background:#262C55;display:grid;place-items:center;flex:none}
.toast .ic svg{width:24px;height:24px}
.toast small{display:block;opacity:.7;font-size:.75em}
/* gate */
.boot{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;align-content:center;gap:14px;font-family:var(--f-display);font-weight:700;color:var(--muted)}
.boot i{width:34px;height:34px;border-radius:50%;border:4px solid var(--surface-2);border-top-color:var(--accent);animation:bootspin .9s linear infinite}
@keyframes bootspin{to{transform:rotate(360deg)}}
.boot[hidden]{display:none}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:max(28px,env(safe-area-inset-top,0px)) 16px 28px}
.gate .wrap{max-width:420px;margin:0 auto;display:grid;gap:18px}
.gate h1{font-size:2.4em;font-weight:800;letter-spacing:-.02em}
.gate h1 b{color:var(--accent)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avs button{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.5em}
.avs button[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2)}
.err{color:var(--bad);font-weight:700;font-size:.9em}
.demo{font-size:.85em;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.demo code{font-weight:700;color:var(--fg)}
.event-banner{border-radius:var(--radius);padding:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--halloween) 30%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--halloween) 40%,var(--line));display:grid;gap:4px}
.viewer{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.vbar b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .btn{padding:8px 14px}
.btn.save{display:flex;align-items:center;justify-content:center;gap:2px;border:2px solid var(--accent);background:var(--surface);color:var(--fg);text-align:left}
.btn.save small{font-weight:400;color:var(--muted)}
.btn.save:disabled{opacity:.7}
.savebtns{margin-top:10px}
.savebtns .btn{flex:1 1 100%}
.save-hint{font-size:.85em;margin:6px 0 0}
.vsave{padding:10px 16px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.vsave[hidden]{display:none!important}
.vpages{--z:1;flex:1;overflow:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start;touch-action:pan-x pan-y pinch-zoom}
.vpages img{width:calc(100% * var(--z));max-width:none;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff}
.art{flex:1 1 0;min-height:80px;max-height:36vh;margin-inline:4%;border-radius:18px;overflow:hidden;background:var(--abg);display:flex}
.art svg{width:100%;height:100%;display:block}
.art.tiles{flex-direction:column;justify-content:center;gap:10px;padding:14px;min-height:120px}
.tile{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-display);font-weight:600;font-size:1.25em;color:#1B2150;flex-wrap:wrap}
.tile span{background:#fff;border-radius:10px;padding:6px 12px}
.tile .to{background:#2A9BC4;color:#fff}
.newsl{display:grid;gap:8px}
.newsl div{background:var(--bg);border-radius:12px;padding:10px 12px}
.newsl small{display:block;color:var(--muted);font-size:.78em}
.src{font-size:.62em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.src.class{background:var(--surface-2);color:var(--fg)}
.src.extra{background:var(--accent);color:var(--accent-fg)}
.src.sample{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.ftag{position:absolute;top:10px;left:12px;font-size:.66em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lnk{font:inherit;font-weight:700;color:var(--accent);background:none;border:0;padding:0 2px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;cursor:pointer}
.cd{display:inline-flex;align-items:baseline;gap:6px;margin-top:6px;background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:3px 12px;font-size:.88em;font-variant-numeric:tabular-nums}
.cd b{font-family:var(--f-display);font-size:1.25em}
.newsl .cd{display:flex;width:max-content}
.row .tx .cd{display:inline-flex}
/* looping animations: run only while the card is on screen */
.art .an{animation-play-state:paused}
.card.on .art .an{animation-play-state:running}
.a-bob{animation:aBob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-drift{animation:aDrift 9s linear infinite}
.a-grow{animation:aGrow 3.2s ease-out infinite;transform-box:fill-box;transform-origin:left center}
.a-zap{animation:aZap 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.a-pulse{animation:aPulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-twinkle{animation:aTw 1.6s ease-in-out infinite}
.a-wave{animation:aWave 1.4s ease-out infinite}
.a-wave2{animation:aWave 1.4s .35s ease-out infinite}
@keyframes aBob{50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes aDrift{from{transform:translateX(30px)}to{transform:translateX(-60px)}}
@keyframes aGrow{0%{transform:scaleX(0)}55%,100%{transform:scaleX(1)}}
@keyframes aZap{0%,35%{opacity:0;transform:translateY(-30px)}48%{opacity:1;transform:translateY(0)}60%{transform:scale(1.15)}70%,100%{opacity:1;transform:scale(1)}}
@keyframes aPulse{50%{transform:scale(1.08)}}
@keyframes aTw{50%{opacity:.2}}
@keyframes aWave{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.comic{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:none;margin-inline:0;background:none}
.comic svg:nth-child(3){grid-column:1/-1;width:calc(50% - 4px);justify-self:center}

var artSVG=function(key,viz){
  if(viz&&viz.timeline){const [l,s]=viz.timeline;
    return `<div class="art" style="--abg:#E2F2F8"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Timeline: ${esc(l)}, then ${esc(s)}"><text x="160" y="40" font-size="13" text-anchor="middle" fill="${INK}" font-family="sans-serif" font-weight="700">PAST</text><rect x="40" y="96" width="240" height="22" rx="11" fill="#BFE6F3"/><rect class="an a-grow" x="40" y="96" width="240" height="22" rx="11" fill="#2A9BC4"/><text x="160" y="146" font-size="15" text-anchor="middle" fill="${INK}" font-family="sans-serif">${esc(l)} (long)</text><path class="an a-zap" d="M168 54l-16 36h14l-10 30 26-40h-14l10-26z" fill="#F2C744" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/><text x="160" y="176" font-size="15" text-anchor="middle" fill="#D2433B" font-family="sans-serif" font-weight="700">⚡ ${esc(s)} (short)</text></svg></div>`;}
  if(viz&&viz.tiles) return `<div class="art tiles" style="--abg:#E2F2F8">${viz.tiles.map(([a,b])=>`<div class="tile"><span>${esc(a)}</span><b>→</b><span class="to">${esc(b)}</span></div>`).join("")}</div>`;
  const a=ART[key]; if(!a) return "";
  return `<div class="art" style="--abg:${a[0]}" aria-hidden="true"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet">${a[1]}</svg></div>`;
}

/* ---------- crypto ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryCode(code){
  code=code.toUpperCase().replace(/\s+/g,"");
  for(const blob of ENC){
    try{
      const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
      const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(blob.salt),iterations:blob.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
      const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(blob.iv)},key,b64(blob.ct));
      return JSON.parse(new TextDecoder().decode(pt));
    }catch(e){}
  }
  return null;
}

/* ---------- save / download (Word & PDF files) ---------- */
// iPhone/iPad: Web Share API with the real file -> share sheet -> "Save to Files" (the installed app ignores <a download>).
// Android & computers: normal download. Files are encrypted .bin files on the same site; the key is in the class data.
const DLICON='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:6px;flex:none"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>';
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const FCACHE="emf-files", FREADY=new Map();
Object.assign(IT,{saveIOS:"Tocca Salva, poi scegli “Salva su File”.",saveOther:"Il file finisce nella cartella Download."});
const fileLabel=f=>/\.docx$/i.test(f.name)?"Word file":/\.pptx$/i.test(f.name)?"PowerPoint":"PDF";
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
async function fetchBin(u){
  let res=null;
  try{ if("caches" in window){ const c=await caches.open(FCACHE); res=await c.match(u);
    if(!res){ const net=await fetch(u); if(!net.ok) throw new Error("net"); await c.put(u,net.clone()); res=net; } } }catch(e){res=null;}
  if(!res){ res=await fetch(u); if(!res.ok) throw new Error("net"); }
  return res.arrayBuffer();
}
async function loadFile(f){
  const buf=await fetchBin(f.u);
  const key=await crypto.subtle.importKey("raw",b64(f.k),"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(f.iv)},key,buf);
  return new File([pt],f.name,{type:f.mime});
}
function prepFile(f){
  const v=FREADY.get(f.u); if(v) return v instanceof File?Promise.resolve(v):v;
  const p=loadFile(f).then(file=>{FREADY.set(f.u,file);return file;},e=>{FREADY.delete(f.u);throw e;});
  FREADY.set(f.u,p); return p;
}
const saveBtns=files=>(files||[]).map((f,i)=>`<button class="btn ghost save" data-save="${i}">${DLICON}<span>Save / Download ${fileLabel(f)} <small>${kb(f.size)}</small></span></button>`).join("");
const saveHint=()=>`<p class="it save-hint">${S.set.italian?(IOS?IT.saveIOS:IT.saveOther):(IOS?"Tap Save, then choose “Save to Files”.":"The file goes to your Downloads folder.")}</p>`;
function saveBlock(files){ return files&&files.length?`<div class="btns savebtns">${saveBtns(files)}</div>${saveHint()}`:""; }
function wireSave(root,files){
  if(!files||!files.length) return;
  files.forEach(f=>prepFile(f).catch(()=>{}));   // fetch + unlock now, so the tap can open the share sheet straight away
  root.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>saveFile(files[+b.dataset.save],b));
}
let SHARING=false;
function shareable(file){
  if(!navigator.share) return null;
  const ok=f=>{try{return !navigator.canShare||navigator.canShare({files:[f]});}catch(e){return false;}};
  if(ok(file)) return file;
  const alt=new File([file],file.name,{type:"application/octet-stream"});   // some iOS versions refuse Office MIME types
  return ok(alt)?alt:null;
}
async function saveFile(f,btn){
  if(!btn.dataset.label) btn.dataset.label=btn.innerHTML;
  const label=btn.dataset.label;
  let file=FREADY.get(f.u);
  if(!(file instanceof File)){
    btn.disabled=true; btn.innerHTML=DLICON+"<span>Getting the file…</span>";
    try{ file=await prepFile(f); }catch(e){ btn.disabled=false; btn.innerHTML=DLICON+"<span>No connection. Go online once, then tap again</span>"; return; }
    btn.disabled=false;
    if(IOS){ btn.innerHTML=DLICON+"<span>Ready: tap again to save</span>"; return; } // iPhone needs a fresh tap for the share sheet
  }
  if(IOS){ // iPhone/iPad: ALWAYS the share sheet, never a new page (a blob page opened in Safari never loads)
    if(SHARING) return;
    const sf=shareable(file);
    if(!sf){ btn.innerHTML=DLICON+"<span>Update your iPhone (iOS 15 or later) to save files</span>"; return; }
    SHARING=true;
    try{ await navigator.share({files:[sf]}); btn.innerHTML=label; }
    catch(e){ btn.innerHTML=(e&&e.name==="AbortError")?label:DLICON+"<span>Tap again to save</span>"; }
    finally{ SHARING=false; }
    return;
  }
  downloadFile(file); btn.innerHTML=label;
}
function downloadFile(file){
  const url=URL.createObjectURL(file), a=document.createElement("a");
  a.href=url; a.download=file.name; a.rel="noopener"; a.style.display="none";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),600000);
}
function mediaRefs(o,out){ // every audio/page-image file in the class data
  if(Array.isArray(o)) o.forEach(v=>mediaRefs(v,out));
  else if(o&&typeof o==="object"){ if(o.$m&&o.u) out.push(o); else for(const k in o) if(k!=="_url") mediaRefs(o[k],out); }
  return out;
}
function warmFiles(){ // keep this class's files in the offline cache (this week's and today's first), drop old ones
  if(!("caches" in window)||!C) return;
  const all=[...mediaRefs([C.weeks&&C.weeks[0],(C.feedDays||{})[today()]],[]),...mediaRefs(C,[]),
    ...[...(C.weeks||[]).flatMap(w=>w.items||[]),...(C.writing||[]),...(C.reading||[])].flatMap(it=>it.files||[])];
  const want=new Set(all.map(f=>new URL(f.u,location.href).href));
  caches.open(FCACHE).then(async c=>{
    for(const req of await c.keys()) if(!want.has(req.url)) await c.delete(req);
    for(const u of want){ if(!(await c.match(u))){ try{ const r=await fetch(u); if(r.ok) await c.put(u,r); }catch(e){} } }
  }).catch(()=>{});
}

  <div class="sec"><div class="seg" id="tf">${[["all","All"],["got","Earned"],["todo","To earn"]].map(([k,l])=>`<button data-f="${k}" aria-pressed="${tFilter===k}">${l}</button>`).join("")}</div>
  <div class="list">${shown.map(t=>{const has=S.trophies[t.id];const hid=t.hidden&&!has;const prog=Math.min(t.goal,t.val(S));
    const col={bronze:"var(--bronze)",silver:"var(--silver)",gold:"var(--gold)",plat:"var(--plat)"}[t.tier];
    return `<div class="troph ${has?"":"locked"}" style="--k:${col}"><div class="ic">${cupSVG(t.tier)}</div><div class="tx"><b>${hid?"Hidden trophy":esc(t.name)}</b><small>${hid?"Keep exploring to find out":esc(t.desc)}${has?" · earned "+shortDate(has):""}</small>${!has&&t.goal>1&&!hid?`<div class="mini"><span style="width:${prog/t.goal*100}%"></span></div><small>${prog}/${t.goal}</small>`:""}</div></div>`}).join("")}</div></div>`;
  $("#hwGo").onclick=()=>{redeem($("#hwIn").value,$("#hwErr"));renderTrophies();};
  v.querySelectorAll("#tf button").forEach(b=>b.onclick=()=>{tFilter=b.dataset.f;renderTrophies();});
}

/* ---------- ME ---------- */
function renderMe(){
  const v=$("#v-me"); const li=levelInfo(S.xp); const lv=li.L;
  const sw=(id,on,label,sub)=>`<div class="set"><div><b>${label}</b>${sub?`<small>${sub}</small>`:""}</div><button class="switch" role="switch" id="${id}" aria-checked="${on}" aria-label="${label}"></button></div>`;
  const seg=(id,opts,cur)=>`<div class="seg" id="${id}">${opts.map(([k,l])=>`<button data-v="${k}" aria-pressed="${String(cur)===String(k)}">${l}</button>`).join("")}</div>`;
  v.innerHTML=`
  <div class="sec"><div style="display:flex;gap:14px;align-items:center"><div class="avatar">${S.av}</div><div style="min-width:0"><h2>${esc(S.nick)}</h2><small class="it">Class ${esc(C.className)} · Level ${lv} · ${li.title}</small></div></div>
    <div class="bar"><span style="width:${li.max?100:Math.round(li.into/li.need*100)}%"></span></div><small class="it">${li.max?"Max level reached. You're a Legend!":`${li.into}/${li.need} XP to level ${lv+1} · max level ${MAX_LEVEL}`}</small>
    <div class="tags"><span class="tag">Streak ${S.streak} school days · best ${S.bestStreak}</span><span class="tag">${S.correct} correct answers</span><span class="tag">${S.hw.length} homework</span></div></div>
  <div class="sec"><div class="eyebrow">Your privacy</div><div class="panel" style="border-color:var(--good)"><b>Nothing about you leaves this phone.</b><small>No account, no email, no real name, no ads, no tracking. Your nickname, trophies, progress and settings are saved on this phone only. Prof. Galli cannot see your activity, and nobody else can either.</small></div></div>
  <div class="sec"><div class="eyebrow">What's new</div><div class="list">${newsItems(x=>`<div class="row"><span class="tx">${x}</span></div>`)}</div></div>
  <div class="sec"><div class="eyebrow">Settings, Accessibility & Display</div><div class="panel" style="gap:0">
    <div class="set"><div><b>Text size</b></div>${seg("sz",[["M","A"],["L","A+"],["XL","A++"]],S.set.size)}</div>
    <div class="set"><div><b>Theme</b></div>${seg("th",[["system","Auto"],["light","Light"],["dark","Dark"]],S.set.theme)}</div>
    <div class="set"><div><b>Listening speed</b><small>Slower tracks for tricky accents</small></div>${seg("rt",[[0.75,"0.75×"],[1,"1×"]],S.set.rate)}</div>
    ${sw("swMotion",S.set.motion,"Reduce motion","Turns off animations")}
    ${sw("swIt",S.set.italian,"Aiuto in italiano","Short Italian hints on instructions")}
  </div></div>
  <div class="sec"><div class="eyebrow">Updates</div><div class="panel"><b>Always up to date</b><small class="it">New material arrives every Friday. The app updates itself: there is nothing to download or install.</small></div></div>
  <div class="sec"><div class="eyebrow">Backup your progress</div><div class="panel">
    <small class="it">Your progress lives only on this phone. Copy this code somewhere safe; paste it on a new phone to restore your trophies.</small>
    <textarea class="txt" id="bk" readonly aria-label="Backup code"></textarea>
    <div class="btns"><button class="btn ghost" id="cp">Copy code</button><button class="btn ghost" id="rs">Restore from code</button></div><div class="err" id="bkMsg" hidden></div></div></div>
  <div class="sec"><div class="eyebrow">Class</div><div class="panel">
    <small class="it">Wrong class, or a new code from Prof. Galli? Leave and unlock again. This also resets your trophies on this phone.</small>
    <button class="btn ghost" id="leave">Leave class & reset</button><div class="err" id="leaveMsg" hidden></div></div></div>`;
  const backup=()=>{const {code,...rest}=S;return btoa(unescape(encodeURIComponent(JSON.stringify(rest))));};
  $("#bk").value=backup();
  $("#cp").onclick=()=>{navigator.clipboard.writeText($("#bk").value).then(()=>{$("#bkMsg").textContent="Copied.";$("#bkMsg").hidden=false},()=>{$("#bk").select();});};
  $("#rs").onclick=()=>{$("#bk").readOnly=false;$("#bk").value="";$("#bk").focus();$("#rs").textContent="Apply code";$("#rs").onclick=()=>{
    try{const d=JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim()))));const code=S.code;S=Object.assign(fresh(),d,{code});persist();applySettings();renderAll();}catch(e){$("#bkMsg").textContent="That code doesn't look right. Paste the whole code.";$("#bkMsg").hidden=false;}};};
  const bindSeg=(id,key,num)=>$("#"+id).querySelectorAll("button").forEach(b=>b.onclick=()=>{S.set[key]=num?+b.dataset.v:b.dataset.v;S.tweaked=true;persist();checkTrophies();applySettings();renderMe();});
  bindSeg("sz","size");bindSeg("th","theme");bindSeg("rt","rate",true);
  $("#swMotion").onclick=()=>{S.set.motion=!S.set.motion;S.tweaked=true;persist();checkTrophies();applySettings();renderMe();};
  $("#swIt").onclick=()=>{S.set.italian=!S.set.italian;persist();renderAll();go("me");};
  let armed=false;$("#leave").onclick=()=>{if(!armed){armed=true;$("#leaveMsg").textContent="Tap again to erase all progress on this phone.";$("#leaveMsg").hidden=false;return;}
    try{localStorage.removeItem(KEY)}catch(e){} S=fresh();C=null;$("#gate").hidden=false;};
}

/* ---------- shell ---------- */
function applySettings(){
  const r=document.documentElement;
  if(S.set.theme==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.set.theme);
  r.setAttribute("data-size",S.set.size);
  if(S.set.motion)r.setAttribute("data-motion","reduce");else r.removeAttribute("data-motion");
}
function updateBadges(){
  const n=(C.weeks[0]?C.weeks[0].items:[]).filter((_,ii)=>!S.seenItems.includes("0-"+ii)).length;
  $("#classBadge").hidden=!n;$("#classBadge").textContent=n;
  $("#bellDot").hidden=S.seenNews>=C.news.length;
}
function go(tab){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="v-"+tab);
  if(tab==="feed"&&feedTop){$("#v-feed").scrollTop=0;feedTop=false;}
  S.tabs[tab]=1;persist();checkTrophies();
  if(tab==="trophies")renderTrophies(); if(tab==="me")renderMe(); if(tab==="practice")renderPractice();
}
function normalise(){C.weeks=C.weeks||[];C.feed=C.feed||[];C.cards=C.cards||[];C.speaking=C.speaking||[];C.news=C.news||[];C.writing=C.writing||[];C.reading=C.reading||[];C.boss=C.boss||[];C.homeworkWords=C.homeworkWords||{};}
function renderAll(){ normalise(); $("#classChip").textContent=C.className; renderFeed();renderClass();renderPractice();renderTrophies();renderMe();updateBadges(); setTimeout(warmFiles,1500); }
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
$("#bell").onclick=()=>{S.seenNews=C.news.length;persist();updateBadges();
  sheet(`<div class="eyebrow">What's new in ${esc(C.className)}</div><div class="list">${newsItems(x=>`<div class="row"><span class="tx">${x}</span></div>`)}</div>`);};

/* gate */
let pickAv=S.av;
$("#avs").innerHTML=AVATARS.map(a=>`<button aria-pressed="${a===pickAv}" aria-label="Avatar ${a}">${a}</button>`).join("");
$("#avs").querySelectorAll("button").forEach(b=>b.onclick=()=>{pickAv=b.textContent;$("#avs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
$("#joinBtn").onclick=async()=>{
  const err=$("#gateErr"); err.hidden=true;
  const code=$("#codeIn").value, nick=$("#nickIn").value.trim();
  if(!nick){err.textContent="Choose a nickname first.";err.hidden=false;return;}
  $("#joinBtn").textContent="Unlocking…";
  const c=await tryCode(code);
  $("#joinBtn").textContent="Unlock my class";
  if(!c){err.textContent="That code doesn't match any class. Check the spelling and try again.";err.hidden=false;return;}
  C=c;S.code=code.toUpperCase().replace(/\s+/g,"");S.nick=nick;S.av=pickAv;persist();
  $("#gate").hidden=true; touchDay(); renderAll(); go("feed"); checkTrophies();
};
(async function boot(){
  try{
    applySettings();
    if(S.code){C=await tryCode(S.code);}
    if(!C){$("#gate").hidden=false;return;}
    touchDay(); renderAll(); go("feed"); checkTrophies();
  }finally{ $("#boot").hidden=true; }
})();
</script>
